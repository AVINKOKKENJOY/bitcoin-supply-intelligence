version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: bsi-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: bitcoin_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: bsi-redis
    ports:
      - "6379:6379"
volumes:
  postgres-data:
  